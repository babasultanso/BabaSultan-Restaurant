steps:
  # 1. Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/babasultan-api:$COMMIT_SHA', '-t', 'gcr.io/$PROJECT_ID/babasultan-api:latest', '.']

  # 2. Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/babasultan-api:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/babasultan-api:latest']

  # 3. Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'babasultan-api'
      - '--image'
      - 'gcr.io/$PROJECT_ID/babasultan-api:latest'
      - '--region'
      - 'europe-west2'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--service-account'
      - 'babasultan-api-sa@$PROJECT_ID.iam.gserviceaccount.com'
      - '--set-env-vars'
      - 'NODE_ENV=production,FRONTEND_URL=https://baba-sultan-restaurant.vercel.app'

images:
  - 'gcr.io/$PROJECT_ID/babasultan-api:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/babasultan-api:latest'
